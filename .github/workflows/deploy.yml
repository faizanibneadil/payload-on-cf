name: Deploy Payload v4 to Cloudflare Workers

on:
  push:
    branches: [main, dev]
    # Sirf docs badlen to deploy ki zaroorat nahi (Actions ke runs bachte hain)
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# Chalta hua deploy beech me cancel nahi hota (warna D1 migration adhi reh sakti hai).
# Naya push queue me wait karta hai; queue me sirf sab se naya run rehta hai.
concurrency:
  group: payload-cf-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      url: ${{ steps.deploy_worker.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
      SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
      NODE_ENV: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate environment variables
        run: node scripts/check-env.mjs

      - name: Set Environment Target
        id: env_target
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "CF_ENV=dev" >> $GITHUB_ENV
            echo "ENV_FLAG=--env dev" >> $GITHUB_ENV
          else
            echo "CF_ENV=production" >> $GITHUB_ENV
            echo "ENV_FLAG=" >> $GITHUB_ENV
          fi

      # Next.js build cache: agla build sirf badli hui files dobara compile karta hai
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Generate importmap and types
        run: |
          pnpm generate:importmap
          pnpm generate:types

      # Deploy se pehle tests: fail hone par migrations/deploy chalte hi nahi.
      # NODE_ENV=test aur khali token — tests kabhi remote (production) D1 se connect nahi hote.
      - name: Run tests
        env:
          NODE_ENV: test
          CLOUDFLARE_API_TOKEN: ''
        run: pnpm test:int

      # Allowed as check-only: verify that schema matches committed migrations without auto-generating/committing
      - name: Check for uncommitted schema migrations (schema drift guard)
        timeout-minutes: 2
        run: |
          pnpm payload migrate:create check --skip-empty
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            echo "Error: Uncommitted schema changes detected! Please generate and commit migrations locally before pushing."
            git status --porcelain src/migrations
            exit 1
          fi

      - name: Apply Payload migrations to D1
        run: |
          if [ "$CF_ENV" = "dev" ]; then
            CLOUDFLARE_ENV=dev pnpm deploy:database
          else
            pnpm deploy:database
          fi

      # Admin user sirf tab banta hai jab database me koi admin na ho (script idempotent hai).
      # Default credentials admin/admin hain; ADMIN_USERNAME / ADMIN_PASSWORD secrets se badal sakte hain.
      - name: Seed default admin user
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ "$CF_ENV" = "dev" ]; then
            CLOUDFLARE_ENV=dev pnpm deploy:seed
          else
            pnpm deploy:seed
          fi

      - name: Configure secrets on Cloudflare Wrangler
        run: |
          if [ -n "$PAYLOAD_SECRET" ]; then
            printf "%s" "$PAYLOAD_SECRET" | pnpm exec wrangler secret put PAYLOAD_SECRET $ENV_FLAG
          fi
          if [ -n "$SMTP_USER" ]; then
            printf "%s" "$SMTP_USER" | pnpm exec wrangler secret put SMTP_USER $ENV_FLAG
          fi
          if [ -n "$SMTP_PASS" ]; then
            printf "%s" "$SMTP_PASS" | pnpm exec wrangler secret put SMTP_PASS $ENV_FLAG
          fi
          if [ -n "$SMTP_HOST" ]; then
            printf "%s" "$SMTP_HOST" | pnpm exec wrangler secret put SMTP_HOST $ENV_FLAG
          fi
          if [ -n "$SMTP_PORT" ]; then
            printf "%s" "$SMTP_PORT" | pnpm exec wrangler secret put SMTP_PORT $ENV_FLAG
          fi
          if [ -n "$SMTP_FROM_ADDRESS" ]; then
            printf "%s" "$SMTP_FROM_ADDRESS" | pnpm exec wrangler secret put SMTP_FROM_ADDRESS $ENV_FLAG
          fi
          if [ -n "$SMTP_FROM_NAME" ]; then
            printf "%s" "$SMTP_FROM_NAME" | pnpm exec wrangler secret put SMTP_FROM_NAME $ENV_FLAG
          fi

      - name: Build and Deploy Worker
        id: deploy_worker
        run: |
          set -o pipefail
          if [ "$CF_ENV" = "dev" ]; then
            CLOUDFLARE_ENV=dev pnpm deploy:app 2>&1 | tee /tmp/deploy.log
          else
            pnpm deploy:app 2>&1 | tee /tmp/deploy.log
          fi
          # Wrangler deploy ke output se asli workers.dev URL nikalo (account subdomain ke saath)
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -1 || true)
          echo "DEPLOYED_URL=$url" >> $GITHUB_ENV
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Smoke test deployed worker endpoints
        run: |
          if [ -z "$DEPLOYED_URL" ]; then
            echo "Could not detect the deployed URL from the deploy log; skipping smoke test."
            exit 0
          fi
          echo "Testing endpoint reachability for $DEPLOYED_URL"
          for endpoint in / /admin; do
            code=$(curl -sS -L -o /tmp/response -w "%{http_code}" "$DEPLOYED_URL$endpoint") || code="000"
            echo "$endpoint => HTTP $code"
            if [ "$code" -ge 500 ]; then
              cat /tmp/response
              exit 1
            fi
          done
