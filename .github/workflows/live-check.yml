name: Live check (browser)

# Asal deployment par Chromium se poora user flow (register, board, sign out, refresh,
# cancel karke refresh, sign in). Har push par NAHI chalta, taake deploy tez rahe:
# - Actions tab me "Run workflow" se haath se (jaise main me merge se pehle), ya
# - dev push ki commit message me "[live-check]" likho to deploy.yml deploy ke baad isay bulata hai.
# Bina "[live-check]" ke deploy ki queue isay kabhi wait nahi karti.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Deployment URL
        required: true
        default: https://payload-on-cf-dev.faizanibneadil1.workers.dev
  workflow_call:
    inputs:
      url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_URL: ${{ inputs.url }}
      # GitHub runner par Google Chrome pehle se install hai: Chromium download nahi karna parta
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Naya Worker version Cloudflare ki har jagah pahunchne me kuch second leta hai
      - name: Wait for the new version to reach all edges
        if: github.event_name == 'push'
        run: sleep 20

      - name: Run live check
        run: node scripts/live-check.mjs "$LIVE_URL"

      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-check-${{ github.run_id }}
          path: live-check-output/
          retention-days: 14
